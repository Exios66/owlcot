<title>owlcot — hermes@owlcot:~</title>
<link rel="icon" href="https://exios66.github.io/owlcot/assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep:   #050709;
    --bg:        #0a0d11;
    --bg-soft:   #0e1217;
    --bg-elev:   #131820;
    --fg:        #d8d4ce;
    --fg-dim:    #6b7585;
    --fg-faint:  #2a303c;
    --amber:     #ffb86c;
    --amber-bright: #ffd09b;
    --phosphor:  #a3e635;
    --cyan:      #67e8f9;
    --magenta:   #f472b6;
    --red:       #ef4444;
    --green:     #4ade80;
    --yellow:    #facc15;
    --border:    #1d2530;
    --forest-1:  #0c130f;
    --forest-2:  #0e1712;
  }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 14px;
    line-height: 1.55;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(ellipse 80% 50% at top, rgba(255, 184, 108, 0.04), transparent 70%),
      radial-gradient(ellipse 60% 40% at bottom, rgba(103, 232, 249, 0.02), transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 50%, rgba(163, 230, 53, 0.01), transparent 60%),
      var(--bg-deep);
  }

  /* film grain noise */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: overlay;
    opacity: 0.05;
  }

  /* === CRT OVERLAY === */
  .crt-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.4s;
  }
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.3) 3px,
      rgba(0,0,0,0.3) 4px
    );
    opacity: 0.5;
    animation: scan 6s linear infinite;
  }
  @keyframes scan {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 110% 100% at center, transparent 45%, rgba(0,0,0,0.6) 100%);
  }
  .flicker {
    position: absolute;
    inset: 0;
    background: rgba(255, 184, 108, 0.015);
    animation: flicker 7s infinite;
  }
  @keyframes flicker {
    0%, 94%, 100% { opacity: 1; }
    95% { opacity: 0.8; }
    96% { opacity: 1; }
    97% { opacity: 0.92; }
    98% { opacity: 1; }
  }

  /* === AMBIENT DARK FOREST (fixed layer behind the terminal) === */
  #ambientForest {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 36vh;
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.6s ease;
    overflow: hidden;
  }
  #ambientForest.off { opacity: 0; }
  #ambientForest .treeline {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 78%;
    display: block;
  }
  #ambientForest .treeline.back { opacity: 0.5; bottom: -6%; }
  .fog {
    position: absolute;
    bottom: -12%;
    width: 70%;
    height: 45%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(20,32,26,0.5), transparent 70%);
    filter: blur(20px);
    animation: fogDrift 90s ease-in-out infinite alternate;
  }
  .fog.f1 { left: -15%; }
  .fog.f2 { right: -20%; animation-duration: 130s; animation-delay: -40s; }
  @keyframes fogDrift {
    0%   { transform: translateX(0)    translateY(0); }
    100% { transform: translateX(12%)  translateY(-4%); }
  }
  .firefly {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px 1px rgba(255, 184, 108, 0.8);
    opacity: 0;
    animation-name: fireflyFloat, fireflyGlow;
    animation-timing-function: ease-in-out, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes fireflyFloat {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(calc(var(--dx) * 0.5), calc(var(--dy) * -0.7)); }
    50%  { transform: translate(var(--dx), var(--dy)); }
    75%  { transform: translate(calc(var(--dx) * 0.3), calc(var(--dy) * 0.6)); }
    100% { transform: translate(0, 0); }
  }
  @keyframes fireflyGlow {
    0%, 100% { opacity: 0; }
    15% { opacity: 0.9; }
    45% { opacity: 0.35; }
    60% { opacity: 0.85; }
    80% { opacity: 0.15; }
  }

  /* === STATUS BAR === */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 16px;
    background: linear-gradient(to bottom, var(--bg-elev), var(--bg-soft) 40%, var(--bg));
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--fg-dim);
    flex-shrink: 0;
    user-select: none;
    letter-spacing: 0.02em;
    position: relative;
    z-index: 3;
  }
  .status-bar::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 184, 108, 0.15) 30%, rgba(255, 184, 108, 0.15) 70%, transparent);
  }
  .status-group { display: flex; gap: 18px; align-items: center; }
  .status-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    padding: 1px 0;
  }
  .status-item b {
    color: var(--amber);
    font-weight: 600;
    text-shadow: 0 0 6px rgba(255, 184, 108, 0.3);
  }
  .status-item a.blog-link {
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px dotted rgba(255, 184, 108, 0.4);
    padding-bottom: 1px;
    transition: color 0.2s ease, text-shadow 0.2s ease, border-color 0.2s ease;
  }
  .status-item a.blog-link:hover {
    color: var(--amber-bright);
    text-shadow: 0 0 10px rgba(255, 184, 108, 0.7);
    border-bottom-color: var(--amber-bright);
  }
  .status-item .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 7px var(--green), 0 0 2px var(--green);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 7px var(--green), 0 0 2px var(--green); }
    50% { opacity: 0.45; transform: scale(0.82); box-shadow: 0 0 3px var(--green); }
  }

  /* === TERMINAL === */
  .terminal {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
    z-index: 2;
    transform-origin: 50% 50%;
    animation: crtOn 0.55s ease-out;
  }
  @keyframes crtOn {
    0%   { transform: scaleY(0.004) scaleX(1.15); filter: brightness(6) saturate(2); opacity: 0.4; }
    55%  { transform: scaleY(1.02) scaleX(1); filter: brightness(1.6); opacity: 1; }
    100% { transform: none; filter: none; opacity: 1; }
  }
  .output {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 10px;
    padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 184, 108, 0.15) transparent;
  }
  .output::-webkit-scrollbar { width: 5px; }
  .output::-webkit-scrollbar-track { background: transparent; }
  .output::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(255, 184, 108, 0.2), rgba(255, 184, 108, 0.08));
    border-radius: 3px;
  }
  .output::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, rgba(255, 184, 108, 0.35), rgba(255, 184, 108, 0.15));
  }
  .output:focus { outline: none; }
  .line {
    margin-bottom: 3px;
    word-break: break-word;
    white-space: pre-wrap;
    animation: lineIn 0.16s ease-out both;
    line-height: 1.6;
  }
  @keyframes lineIn {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* CRT sweep used on clear */
  .crt-sweep {
    position: absolute;
    left: 0; right: 0;
    height: 18%;
    top: -20%;
    background: linear-gradient(180deg, transparent, rgba(255,184,108,0.1), transparent);
    animation: sweepDown 0.45s linear forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes sweepDown {
    from { top: -20%; }
    to   { top: 105%; }
  }

  /* === PROMPT === */
  .prompt-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    position: relative;
    flex-shrink: 0;
  }
  .prompt-line::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 184, 108, 0.1) 20%, rgba(255, 184, 108, 0.1) 80%, transparent);
  }
  .prompt {
    color: var(--green);
    text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
    font-weight: 600;
    flex-shrink: 0;
    user-select: none;
    letter-spacing: 0.01em;
  }
  .prompt .path {
    color: var(--cyan);
    text-shadow: 0 0 8px rgba(103, 232, 249, 0.45);
  }
  .prompt.compose { color: var(--magenta); text-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }
  .input-area { position: relative; flex: 1; min-width: 0; }
  .input-display { pointer-events: none; color: var(--fg); }
  .ghost-text { color: var(--fg-dim); opacity: 0.5; }
  .block-cursor {
    display: inline-block;
    width: 8px;
    height: 17px;
    background: var(--amber);
    vertical-align: text-bottom;
    box-shadow: 0 0 8px var(--amber), 0 0 2px var(--amber);
    animation: blink 1.06s steps(2, end) infinite;
    margin-left: 1px;
    margin-right: 1px;
  }
  @keyframes blink {
    0%, 49.999% { opacity: 1; box-shadow: 0 0 8px var(--amber), 0 0 2px var(--amber); }
    50%, 100% { opacity: 0; box-shadow: none; }
  }
  #cmdInput {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: transparent;
    caret-color: transparent;
    font: inherit;
    /* iOS zooms the viewport on focus for inputs below 16px — this input is
       invisible, so the size only affects that zoom behavior. */
    font-size: 16px;
    z-index: 2;
    cursor: text;
    padding: 0;
  }

  /* === TEXT === */
  .error { color: var(--red); text-shadow: 0 0 6px rgba(239, 68, 68, 0.45); }
  .success { color: var(--green); text-shadow: 0 0 4px rgba(74, 222, 128, 0.3); }
  .info, .cyan { color: var(--cyan); text-shadow: 0 0 4px rgba(103, 232, 249, 0.25); }
  .warn, .yellow { color: var(--yellow); text-shadow: 0 0 4px rgba(250, 204, 21, 0.3); }
  .dim { color: var(--fg-dim); }
  .amber { color: var(--amber); }
  .magenta { color: var(--magenta); }
  .phosphor { color: var(--phosphor); }
  .cmd-echo { color: var(--fg); }
  .shake { animation: shake 0.3s ease-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  /* === MARKDOWN === */
  .post { margin: 8px 0 14px; }
  .post h1, .post h2, .post h3 {
    color: var(--amber);
    font-weight: 600;
    text-shadow: 0 0 12px rgba(255, 184, 108, 0.4);
    line-height: 1.3;
    margin: 20px 0 10px;
  }
  .post h1 {
    font-size: 1.5em;
    letter-spacing: -0.01em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, transparent 60%, rgba(255, 184, 108, 0.04));
    padding-top: 4px;
  }
  .post h2 {
    font-size: 1.2em;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(255, 184, 108, 0.1);
  }
  .post h3 { font-size: 1.05em; color: var(--amber-bright); }
  .post p { margin: 8px 0; color: var(--fg); }
  .post em { color: var(--fg); font-style: italic; opacity: 0.85; }
  .post strong { color: var(--amber-bright); font-weight: 600; text-shadow: 0 0 4px rgba(255, 208, 155, 0.2); }
  .post code {
    color: var(--phosphor);
    background: rgba(163, 230, 53, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.93em;
    border: 1px solid rgba(163, 230, 53, 0.15);
  }
  .post pre {
    margin: 12px 0;
    background: linear-gradient(135deg, var(--bg-soft), var(--bg-elev));
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    overflow-x: auto;
    position: relative;
  }
  .post pre::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(163, 230, 53, 0.2) 50%, transparent);
  }
  .post pre code {
    display: block;
    padding: 0;
    background: transparent;
    border: none;
    color: var(--fg);
    font-size: 0.93em;
    line-height: 1.55;
  }
  .post a {
    color: var(--cyan);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-color: rgba(103, 232, 249, 0.35);
    transition: color 0.2s ease, text-decoration-color 0.2s ease, text-shadow 0.2s ease;
  }
  .post a:hover {
    color: var(--magenta);
    text-decoration-color: var(--magenta);
    text-shadow: 0 0 8px rgba(244, 114, 182, 0.3);
  }
  .post blockquote {
    border-left: 3px solid var(--amber);
    padding: 8px 0 8px 16px;
    margin: 14px 0;
    color: var(--fg-dim);
    font-style: italic;
    background: linear-gradient(90deg, rgba(255, 184, 108, 0.05), transparent 80%);
    border-radius: 0 3px 3px 0;
  }
  .post blockquote p { color: var(--fg-dim); }
  .post ul, .post ol { padding-left: 24px; margin: 8px 0; }
  .post li { margin: 3px 0; }
  .post ul li::marker, .post ol li::marker { color: var(--amber); }
  .divider { color: var(--fg-faint); margin: 10px 0; overflow: hidden; opacity: 0.5; }
  .post-footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    color: var(--fg-dim);
  }
  .post-footer a { color: var(--cyan); }

  /* === LISTING === */
  .listing {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 24px;
    margin: 6px 0;
    line-height: 1.75;
  }
  .file {
    color: var(--fg);
    padding: 1px 4px;
    border-radius: 2px;
    transition: background 0.15s ease;
  }
  .file:hover {
    background: rgba(255, 184, 108, 0.06);
  }
  .file.dir {
    color: var(--cyan);
    font-weight: 500;
    text-shadow: 0 0 4px rgba(103, 232, 249, 0.2);
  }
  .file.dir::after { content: '/'; opacity: 0.6; }
  .file.md {
    color: var(--amber);
    text-shadow: 0 0 3px rgba(255, 184, 108, 0.15);
  }
  .file.hidden { color: var(--fg-dim); opacity: 0.7; }

  /* === MAN PAGE === */
  .man-page {
    border: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(255,184,108,0.025), rgba(255,184,108,0.005));
    padding: 12px 16px;
    margin: 10px 0;
    border-radius: 4px;
    box-shadow: inset 0 0 30px rgba(255, 184, 108, 0.03), 0 2px 8px rgba(0, 0, 0, 0.15);
    position: relative;
    overflow: hidden;
  }
  .man-page::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 184, 108, 0.15) 30%, rgba(255, 184, 108, 0.15) 70%, transparent);
  }
  .man-page pre { font: inherit; white-space: pre-wrap; color: var(--fg); }

  /* === BOOT === */
  .boot-line {
    color: var(--fg-dim);
    font-size: 0.95em;
    padding: 1px 0;
  }
  .boot-line .ok {
    color: var(--green);
    font-weight: 600;
    text-shadow: 0 0 4px rgba(74, 222, 128, 0.3);
  }
  .boot-line .warn {
    color: var(--yellow);
    font-weight: 600;
    text-shadow: 0 0 4px rgba(250, 204, 21, 0.3);
  }
  .neofetch { color: var(--fg); line-height: 1.35; margin: 8px 0; }
  .lore-line { color: var(--fg-dim); }
  .motd {
    margin: 10px 0 8px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber);
    background: linear-gradient(135deg, rgba(255,184,108,0.04), rgba(255,184,108,0.01));
    padding: 12px 16px;
    border-radius: 0 4px 4px 0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    position: relative;
  }
  .motd::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, rgba(255, 184, 108, 0.2), transparent 60%);
  }
  .motd p { margin: 3px 0; }
  .title-card {
    margin: 8px 0 6px;
    overflow-x: auto;
    position: relative;
  }
  .title-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 184, 108, 0.15) 30%, rgba(255, 184, 108, 0.15) 70%, transparent);
  }
  .title-card pre {
    font: inherit;
    line-height: 1.15;
    display: inline-block;
    color: var(--fg);
  }
  .banner {
    color: var(--amber);
    text-shadow: 0 0 16px rgba(255, 184, 108, 0.4);
    animation: bannerIn 0.9s ease-out both;
  }
  /* NB: no letter-spacing animation — these are column-aligned block
     letters and spacing changes would bend the rows. */
  @keyframes bannerIn {
    0% { opacity: 0; filter: brightness(3); }
    100% { opacity: 1; filter: brightness(1); }
  }
  .owl-art { color: var(--fg); display: inline-block; }
  .owl-art .eye {
    display: inline-block;
    color: var(--amber);
    text-shadow: 0 0 10px rgba(255, 184, 108, 0.8);
    animation: owlBlink 4.6s ease-in-out infinite;
    transform-origin: 50% 50%;
  }
  .owl-art .eye.e2 { animation-delay: 0.05s; }
  @keyframes owlBlink {
    0%, 91%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.08); }
    97% { transform: scaleY(1); }
  }
  .hop-in { animation: hopIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes hopIn {
    0%   { transform: translateY(-16px); opacity: 0; }
    70%  { transform: translateY(2px); opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .owl-bob { animation: bob 3.4s ease-in-out 0.6s infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }

  .theme-flash { }
  body.theme-flash .terminal { animation: themeFlash 0.35s ease-out; }

// =================== AUDIO ===================
let audioCtx;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playClick() {
  if (!state.sound) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(1700 + Math.random() * 500, now);
  gain.gain.setValueAtTime(0.018, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.03);
}
function playBell() {
  if (!state.sound) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, now);
  osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
  gain.gain.setValueAtTime(0.04, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now + 0.4);
}
function playHoot() {
  if (!state.sound) return;
  ensureAudio();
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  [[392, 0, 0.14], [316, 0.16, 0.22]].forEach(([f, dt, dur]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(f, t0 + dt);
    osc.frequency.exponentialRampToValueAtTime(f * 0.82, t0 + dt + dur);
    gain.gain.setValueAtTime(0.05, t0 + dt);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0 + dt); osc.stop(t0 + dt + dur + 0.02);
  });
}

}

function printBlank() { print('&nbsp;'); }

function inlineMd(text) {
  return text
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderMarkdown(md) {
  const lines = escapeHtml(md).split('\n');
  const out = [];
  let inUl = false, inOl = false, inCode = false;
  let paraBuf = [];
  const flushPara = () => { if (paraBuf.length) { out.push('<p>' + paraBuf.join(' ') + '</p>'); paraBuf = []; } };
  const closeLists = () => { if (inUl) { out.push('</ul>'); inUl = false; } if (inOl) { out.push('</ol>'); inOl = false; } };

  for (const line of lines) {
    if (line.match(/^```/)) {
      if (inCode) { out.push('</code></pre>'); inCode = false; }
      else { flushPara(); closeLists(); out.push('<pre><code>'); inCode = true; }
      continue;
    }
    if (inCode) { out.push(line + '\n'); continue; }
    if (line.trim() === '') { flushPara(); closeLists(); continue; }
    let m;
    if (m = line.match(/^### (.+)$/)) { flushPara(); closeLists(); out.push('<h3>' + inlineMd(m[1]) + '</h3>'); }
    else if (m = line.match(/^## (.+)$/)) { flushPara(); closeLists(); out.push('<h2>' + inlineMd(m[1]) + '</h2>'); }
    else if (m = line.match(/^# (.+)$/)) { flushPara(); closeLists(); out.push('<h1>' + inlineMd(m[1]) + '</h1>'); }
    else if (m = line.match(/^&gt; ?(.+)$/)) { flushPara(); closeLists(); out.push('<blockquote>' + inlineMd(m[1]) + '</blockquote>'); }
    else if (m = line.match(/^(\d+)\. (.+)$/)) {
      flushPara();
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push('<li>' + inlineMd(m[2]) + '</li>');
    } else if (m = line.match(/^[-*] (.+)$/)) {
      flushPara();
      if (inOl) { out.push('</ol>'); inOl = false; }
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push('<li>' + inlineMd(m[1]) + '</li>');
    } else if (line.match(/^---+$/)) {
      flushPara(); closeLists();
      out.push('<div class="divider">' + '─'.repeat(72) + '</div>');
    } else {
      paraBuf.push(inlineMd(line));
    }
  }
  flushPara(); closeLists();
  if (inCode) {
    if (out.length && out[out.length - 1].endsWith('\n')) out[out.length - 1] = out[out.length - 1].replace(/\n$/, '');
    out.push('</code></pre>');
  }
  return out.join('');
}

// =================== FILESYSTEM ===================
function normalizePath(base, rel) {
  const parts = base === '~' ? [] : base.slice(2).split('/');
  for (const seg of rel.split('/')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') parts.pop();
    else if (seg === '~') parts.length = 0;
    else parts.push(seg);
  }
  return parts.length ? '~/' + parts.join('/') : '~';
}
function resolvePath(input) {
  if (!input || input === '~') return '~';
  if (input === '.') return state.cwd;
  let base = state.cwd;
  let rest = input;
  if (input.startsWith('~/')) { base = '~'; rest = input.slice(2); }
  else if (input.startsWith('/')) { base = '~'; rest = input.slice(1); }
  return normalizePath(base, rest);
}
function isDir(path) {
  if (path === '~' || path === '~/entries' || path === '~/topics') return true;
  if (path.startsWith('~/topics/')) return TOPICS.includes(path.split('/').pop());
  return false;
}
function postsForTag(tag) {
  return POST_NAMES.filter(n => POSTS[n].tags.includes(tag));
}
function listDir(path) {
  if (path === '~') return [
    { name: 'entries', type: 'dir' },
    { name: 'topics', type: 'dir' },
    { name: 'README.md', type: 'file', cls: 'md' },
    { name: '.plan', type: 'file', cls: 'hidden' },
    { name: '.about', type: 'file', cls: 'hidden' },
    { name: '.contact', type: 'file', cls: 'hidden' },
  ];
  if (path === '~/entries') return POST_NAMES.map(n => ({ name: n, type: 'file', cls: 'md' }));
  if (path === '~/topics') return TOPICS.map(t => ({ name: t, type: 'dir' }));
  if (path.startsWith('~/topics/')) {
    const tag = path.split('/').pop();
    return postsForTag(tag).map(n => ({ name: n, type: 'file', cls: 'md' }));
  }
  return null;
}
function wrapDoc(content, name) { return { content: content, name: name }; }
function resolveFile(input) {
  const path = resolvePath(input);
  const last = path.split('/').pop();

  if (last === 'README.md') return wrapDoc(OWL ? OWL.intro : '', 'README.md');
  if (last === '.about') return wrapDoc(OWL ? OWL.about : '', '.about');
  if (last === '.contact') return wrapDoc(OWL ? OWL.contact : '', '.contact');
  if (last === '.plan') return wrapDoc(OWL ? OWL.plan : '', '.plan');

  if (state.cwd === '~/entries' && POSTS[input]) return POSTS[input];
  if (path.startsWith('~/entries/') && POSTS[last]) return POSTS[last];
  // from anywhere: a bare entry filename resolves to its post
  if (POSTS[input]) return POSTS[input];
  if (POSTS[last]) return POSTS[last];
  if (input === 'latest' && LATEST) return LATEST;
  return null;
}

// =================== COMPLETION ===================
function getCurrentWord() {
  const val = cmdInput.value;
  const words = val.split(' ');
  return { word: words[words.length - 1], isFirst: words.length === 1, cmd: words[0], words };
}
function fileCandidates(cmd) {
  if (state.cwd === '~/entries') return POST_NAMES.slice();
  if (state.cwd === '~/topics') return TOPICS.map(t => t + '/');
  if (state.cwd.startsWith('~/topics/')) return postsForTag(state.cwd.split('/').pop());
  // from ~ or elsewhere: offer full relative paths plus dotfiles
  const fromRoot = ['entries/', 'topics/']
    .concat(POST_NAMES.map(n => 'entries/' + n))
    .concat(TOPICS.map(t => 'topics/' + t + '/'));
  return (cmd === 'cd')
    ? ['entries', 'topics'].concat(TOPICS).concat(fromRoot.filter(c => c.endsWith('/')).map(c => c.replace(/\/$/, '')))
    : HOME_FILES.concat(fromRoot);
}
function getCandidates(word, isFirst, cmd) {
  let candidates = [];
  if (isFirst) candidates = Object.keys(COMMANDS).sort();
  else if (cmd === 'cat' || cmd === 'ls' || cmd === 'open') candidates = fileCandidates(cmd);
  else if (cmd === 'cd') candidates = [...new Set(fileCandidates('cd').concat(['..', '~']))];
  else if (cmd === 'read') candidates = POSTS && POST_NAMES.length ? POST_NAMES.map(n => String(POSTS[n].num)) : [];
  else if (cmd === 'man' || cmd === 'help') candidates = [...new Set(Object.keys(MAN_PAGES).concat(Object.keys(COMMANDS)))];
  else if (cmd === 'theme') candidates = Object.keys(THEMES);
  else if (cmd === 'crt' || cmd === 'sound' || cmd === 'forest') candidates = ['on', 'off'];
  else if (cmd === 'mail') candidates = [];
  return candidates;
}
function updateGhost() {
  const { word, isFirst, cmd } = getCurrentWord();
  if (!word) { ghostText.textContent = ''; return; }
  const candidates = getCandidates(word, isFirst, cmd);
  const matches = candidates.filter(c => c.toLowerCase().startsWith(word.toLowerCase()));
  if (matches.length === 0) ghostText.textContent = '';
  else if (matches.length === 1) ghostText.textContent = matches[0].slice(word.length);
  else {
    let prefix = matches[0];
    for (const m of matches) while (!m.toLowerCase().startsWith(prefix.toLowerCase())) prefix = prefix.slice(0, -1);
    ghostText.textContent = prefix.length > word.length ? prefix.slice(word.length) : '';
  }
}
function acceptCompletion() {
  if (ghostText.textContent) {
    cmdInput.value += ghostText.textContent;
    typedText.textContent = cmdInput.value;
    ghostText.textContent = '';
    updateGhost();
    playClick();
    return;
  }
  const { word, isFirst, cmd } = getCurrentWord();
  if (word) {
    const candidates = getCandidates(word, isFirst, cmd);
    const matches = candidates.filter(c => c.toLowerCase().startsWith(word.toLowerCase()));
    if (matches.length > 1) {
      print('<span class="dim">' + matches.map(escapeHtml).join('    ') + '</span>');
      return;
    }
  }
  playBell();
}

// =================== HISTORY ===================
function navigateHistory(dir) {
  if (state.history.length === 0) return;
  if (dir === -1) {
    if (state.historyIndex === -1) state.historyIndex = state.history.length - 1;
    else if (state.historyIndex > 0) state.historyIndex--;
    else return;
  } else {
    if (state.historyIndex === -1) return;
    if (state.historyIndex < state.history.length - 1) state.historyIndex++;
    else { state.historyIndex = -1; cmdInput.value = ''; typedText.textContent = ''; ghostText.textContent = ''; return; }
  }
  cmdInput.value = state.history[state.historyIndex];
  typedText.textContent = cmdInput.value;
  ghostText.textContent = '';
  updateGhost();
}
function saveHistory(cmd) {
  if (state.history[state.history.length - 1] !== cmd) state.history.push(cmd);
  if (state.history.length > 100) state.history.shift();
  state.historyIndex = -1;
  try { localStorage.setItem('owlcotHistory', JSON.stringify(state.history)); } catch (e) {}
}

// =================== TYPED OUTPUT ===================
let typingCancelled = false;
async function typeOutText(text, targetEl, delay = 4, pre = true) {
  typingCancelled = false;
  targetEl.innerHTML = '';
  const wrap = (buf) => pre
    ? '<pre>' + buf.replace(/\n/g, '<br>') + '</pre>'
    : buf.replace(/\n/g, '<br>');
  let buf = '';
  for (let i = 0; i < text.length; i++) {
    if (typingCancelled) {
      targetEl.innerHTML = wrap(escapeHtml(text));
      scrollBottom();
      return;
    }
    buf += escapeHtml(text[i]);
    targetEl.innerHTML = wrap(buf);
    if (i % 6 === 0) scrollBottom();
    if (text[i] !== ' ' && text[i] !== '\n' && i % 2 === 0) await sleep(reduced() ? 0 : delay);
    else if (text[i] === '\n') await sleep(reduced() ? 0 : delay * 2);
  }
  scrollBottom();
}
function printManPage(text) {
  const div = document.createElement('div');
  div.className = 'line man-page';
  output.appendChild(div);
  scrollBottom();
  typeOutText(text, div, 1.4);
}

function spawnFireflies(container, count) {
  if (reduced()) return;
  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'firefly';
    f.style.left = (4 + Math.random() * 92) + '%';
    f.style.top = (8 + Math.random() * 80) + '%';
    f.style.setProperty('--dx', ((Math.random() * 60) - 30).toFixed(0) + 'px');
    f.style.setProperty('--dy', ((Math.random() * 40) - 20).toFixed(0) + 'px');
    f.style.animationDuration = (4 + Math.random() * 6).toFixed(2) + 's, ' + (2.5 + Math.random() * 4).toFixed(2) + 's';
    f.style.animationDelay = (Math.random() * 6).toFixed(2) + 's, ' + (Math.random() * 4).toFixed(2) + 's';
    container.appendChild(f);
  }
}
function buildTreeline(svg, fill) {
  const W = 1440, H = 140;
  let d = 'M0 ' + H + ' L0 58';
  let x = 0;
  while (x < W) {
    const w = 26 + Math.random() * 34;
    const h = 38 + Math.random() * 72;
    const baseY = 58 + Math.random() * 20;
    d += ' L' + (x + w / 2).toFixed(1) + ' ' + (baseY - h).toFixed(1)
       + ' L' + (x + w).toFixed(1) + ' ' + baseY.toFixed(1);
    x += w * 0.62;
  }
  d += ' L' + W + ' 58 L' + W + ' ' + H + ' Z';
  svg.innerHTML = '<path d="' + d + '" fill="' + fill + '"/>';
}
function initAmbientForest() {
  const root = $('ambientForest');
  root.classList.toggle('off', !state.forest);
  buildTreeline($('treelineBack'), 'var(--forest-2)');
  buildTreeline($('treelineFront'), 'var(--forest-1)');
  spawnFireflies($('ambientFireflies'), 9);
}
function setForest(on) {
  state.forest = on;
  $('ambientForest').classList.toggle('off', !on);
  savePrefs();
}
function scheduleShootingStar(scene) {
  if (reduced()) return;
  setTimeout(() => {
    if (!scene.isConnected) return;
    const s = document.createElement('span');
    s.className = 'shooting-star';
    s.style.top = (4 + Math.random() * 28) + '%';
    s.style.left = (6 + Math.random() * 38) + '%';
    scene.appendChild(s);
    setTimeout(() => s.remove(), 1500);
    scheduleShootingStar(scene);
  }, 4500 + Math.random() * 8000);
}

    return terms.every(t => hay.includes(t));
  });
  if (!hits.length) { print('no matches for \'' + args.join(' ') + '\'. the forest keeps its secrets.', 'dim'); return; }
  hits.forEach(n => {
    const p = POSTS[n];
    print('  <span class="file md">entries/' + escapeHtml(n) + '</span> <span class="dim">· ' + escapeHtml(p.date) + ' · ' + escapeHtml(p.title) + ' · #' + escapeHtml(p.tags.join(' #')) + '</span>');
  });
  print('<span class="dim">' + hits.length + ' breadcrumb(s) found. cat any of them.</span>');
};

COMMANDS.read = (args) => {
  let target = LATEST;
  if (args[0]) {
    const num = parseInt(args[0], 10);
    target = POST_NAMES.map(n => POSTS[n]).find(p => p.num === num) || null;
    if (!target) { print('read: no entry #' + args[0], 'error'); return; }
  }
  if (!target) { print('no entries mounted — data.js missing. run tools/update_index.py', 'error'); return; }
  catPost(target);
};

COMMANDS.open = (args) => {

  print('<span class="dim">opening</span> <a class="cyan" href="' + escapeHtml(file.url) + '" target="_blank" rel="noopener">' + escapeHtml(file.url) + '</a>');
  setTimeout(() => { try { window.open(file.url, '_blank', 'noopener'); } catch (e) {} }, 350);
};

// =================== MAIL ===================
function startMailCompose(to) {
  composeState = { to, subject: '', lines: [], mode: 'subject' };
  printRaw('<div class="mail-form"><span class="dim">┌── compose ──────────────────────────────</span>\n<span class="dim">│</span> <span class="dim">to:</span> <span class="cyan">' + escapeHtml(to) + '</span>\n<span class="dim">│</span> <span class="dim">subject:</span> <span class="dim">(type below, then Enter)</span>\n<span class="dim">└─────────────────────────────────────────</span></div>');
  updatePrompt();
}
function handleComposeLine(val) {
  if (!composeState) return;
  if (composeState.mode === 'subject') {
    composeState.subject = val;
    print('<span class="dim">subject:</span> <span class="amber">' + escapeHtml(val) + '</span>');
    print('<span class="dim">type your message. end with a single "." on its own line, or Ctrl+D.</span>', 'dim');
    composeState.mode = 'body';
  } else {
    if (val === '.') finishMailCompose();
    else { composeState.lines.push(val); print('<span class="dim">›</span> ' + escapeHtml(val)); }
  }
}
function finishMailCompose() {
  if (!composeState) return;
  const cs = composeState;
  printBlank();
  const body = cs.lines.join('\n');
  printRaw('<div class="mail-summary"><span class="dim">─── message ready ───</span>\n\n  <span class="dim">To:</span> <span class="cyan">' + escapeHtml(cs.to) + '</span>\n  <span class="dim">Subject:</span> <span class="amber">' + escapeHtml(cs.subject || '(no subject)') + '</span>\n\n' + (body ? cs.lines.map(l => '  ' + escapeHtml(l)).join('\n') : '  <span class="dim">(empty body)</span>') + '\n\n<span class="success">[message handed to your mail client as backup.]</span>\n<span class="dim">[no SMTP lives in a static forest — but telegram does: type \'mail\' with no args]</span></div>');
  composeState = null;
  updatePrompt();
  const mailto = 'mailto:' + cs.to + '?subject=' + encodeURIComponent(cs.subject) + '&body=' + encodeURIComponent(body);
  setTimeout(() => { try { window.open(mailto, '_blank'); } catch (e) {} }, 800);
}

// =================== SUBMIT ===================
function submitCommand(raw) {
  const val = raw.trim();
  const pathStr = state.cwd === '~' ? ':~' : ':' + state.cwd.replace(/^~\//, '~/');
  print('<span style="color:var(--green)">hermes@owlcot</span><span class="path">' + pathStr + '</span>$ ' + escapeHtml(val), 'cmd-echo');
  if (!val) return;
  saveHistory(val);
  const parts = val.split(/\s+/);
  const cmd = parts[0];
  const args = parts.slice(1);
  if (COMMANDS[cmd]) {
    try {
      const r = COMMANDS[cmd](args);
      // async commands (owl, hoot, forest) must not leak unhandled rejections
      if (r && typeof r.catch === 'function') {
        r.catch(e => { print('<span class="error">internal error: ' + escapeHtml(e.message) + '</span>'); console.error(e); });
      }
    }
    catch (e) { print('<span class="error">internal error: ' + escapeHtml(e.message) + '</span>'); console.error(e); }
  } else {
    print('<span class="error shake">' + cmd + ': command not found</span>');
    const known = Object.keys(COMMANDS);
    const close = known.filter(c => c.startsWith(cmd.slice(0, Math.max(1, cmd.length - 2)))).slice(0, 3);
    if (close.length) print('<span class="dim">did you mean: ' + close.map(s => '`' + s + '`').join(' / ') + '?</span>', 'dim');
    print("<span class='dim'>type 'help' for available commands.</span>", 'dim');
    playBell();
  }
}

// =================== INPUT ===================
cmdInput.addEventListener('keydown', (e) => {
  typingCancelled = true;

  if (composeState) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = cmdInput.value;
      handleComposeLine(val);
      cmdInput.value = '';
      typedText.textContent = '';
      ghostText.textContent = '';
      playClick();
    } else if (e.key === 'd' && e.ctrlKey) {
      e.preventDefault();
      if (composeState.mode === 'body') { finishMailCompose(); cmdInput.value = ''; typedText.textContent = ''; }
    } else if (e.key === 'c' && e.ctrlKey) {
      e.preventDefault();
      print('<span class="error">^C</span> <span class="dim">[compose cancelled]</span>');
      composeState = null;
      cmdInput.value = '';
      typedText.textContent = '';
      updatePrompt();
    }
    return;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    const val = cmdInput.value;
    submitCommand(val);
    cmdInput.value = '';
    typedText.textContent = '';
    ghostText.textContent = '';
    playClick();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    acceptCompletion();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    navigateHistory(-1);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    navigateHistory(1);
  } else if (e.key === 'ArrowRight' && ghostText.textContent) {
    e.preventDefault();
    cmdInput.value += ghostText.textContent;
    typedText.textContent = cmdInput.value;
    ghostText.textContent = '';
    updateGhost();
    playClick();
  } else if (e.key === 'End') {
    if (ghostText.textContent) {
      e.preventDefault();
      cmdInput.value += ghostText.textContent;
      typedText.textContent = cmdInput.value;
      ghostText.textContent = '';
      updateGhost();
    }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    output.innerHTML = '';
    sweepFx();
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    const val = cmdInput.value;
    const pathStr = state.cwd === '~' ? ':~' : ':' + state.cwd.replace(/^~\//, '~/');
    print('<span style="color:var(--green)">hermes@owlcot</span><span class="path">' + pathStr + '</span>$ ' + escapeHtml(val) + '<span class="error">^C</span>', 'cmd-echo');
    cmdInput.value = '';
    typedText.textContent = '';
    ghostText.textContent = '';
  }
});

cmdInput.addEventListener('input', () => {
  typedText.textContent = cmdInput.value;
  updateGhost();
  playClick();
});

cmdInput.addEventListener('paste', () => {
  setTimeout(() => { typedText.textContent = cmdInput.value; updateGhost(); }, 0);
});

// Click anywhere in terminal focuses input
document.querySelector('.terminal').addEventListener('click', (e) => {
  if (window.getSelection().toString()) return;
  cmdInput.focus();
});

// =================== CLOCK ===================
function formatUptime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + sec + 's';
  return sec + 's';
}
function updateClock() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  statusTime.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
setInterval(updateClock, 1000);
updateClock();

// =================== MOTD ===================
function printMotd() {
  const hint = '<div class="motd">'
    + '<p><span class="amber" style="font-weight:600">owlcot</span> <span class="dim">—</span> a journal that behaves like a terminal.</p>'
    + '<p>type <span class="success">help</span> for the manual · <span class="success">ls</span> to look around · <span class="success">cat README.md</span> to begin</p>'
    + '<p>type <span class="success">forest</span> to enter the dark forest · <span class="success">owl</span> to summon the resident · <span class="success">neofetch</span> for fun</p>'
    + '<p>the same words live as a classic blog — type <span class="success">web</span> or <span class="success">blog</span>, or click <a class="blog-link" href="' + BLOG_HREF + '">blog&nbsp;↗</a> above</p>'
    + '</div>';
  printRaw(hint);
}

// =================== BOOT ===================
function titleCard() {
  // owl perched on top of the OWLCOT banner
  const pad = ' '.repeat(9);
  const owlLines = OWL_MED.map(l => pad + l);
  const card = owlLines.concat(BANNER).join('\n');
  const tagline = 'the journal of Hermes Chan — typed from the dark forest';
  const html = '<div class="title-card"><pre>'
    + '<span class="owl-art hop-in owl-bob">' + owlLines.join('\n') + '</span>\n'
    + '<span class="banner">' + escapeHtml(BANNER.join('\n')) + '</span>\n'
    + '<span class="dim">' + ' '.repeat(Math.max(0, Math.floor((25 - tagline.length) / 2))) + escapeHtml(tagline) + '</span>'
    + '</pre></div>';
  printRaw(html);
  void card;
}

async function boot() {
  applyTheme(state.theme, true);
  document.getElementById('crtOverlay').style.opacity = state.crt ? '1' : '0';
  $('statusCrt').textContent = state.crt ? 'on' : 'off';
  $('statusSound').textContent = state.sound ? 'on' : 'off';
  $('statusBlog').href = BLOG_HREF;
  updatePrompt();
  initAmbientForest();

  if (!OWL) {
    print('<span class="error">owlcot: entry database not loaded (data.js missing?).</span>');
    print('<span class="dim">run: python3 tools/update_index.py && mkdocs build</span>');
    print('<span class="dim">the shell still works — entries are just an empty forest.</span>');
    printBlank();
  }

  titleCard();
  await sleep(reduced() ? 0 : 500);

  // Boot progress bar
  const progressEl = print('', 'boot-line');
  const totalSteps = 8;
  const barWidth = 30;
  for (let i = 0; i <= totalSteps; i++) {
    const filled = Math.round((i / totalSteps) * barWidth);
    const empty = barWidth - filled;
    const pct = Math.round((i / totalSteps) * 100);
    const bar = '<span class="dim">[</span><span class="amber">' + '█'.repeat(filled) + '</span><span class="dim">' + '░'.repeat(empty) + ']</span> <span class="dim">' + pct + '%</span>';
    progressEl.innerHTML = bar;
    if (i < totalSteps) await sleep(reduced() ? 0 : 40);
  }
  await sleep(reduced() ? 0 : 150);

  const bootLines = [
    { t: '[ <span class="ok">OK</span> ] owlcot shell 1.0.0 — dark forest edition', d: 55 },
    { t: '[ <span class="ok">OK</span> ] mounting <span class="cyan">/entries</span> <span class="dim">(' + POST_NAMES.length + ' breadcrumbs)</span>', d: 80 },
    { t: '[ <span class="ok">OK</span> ] mounting <span class="cyan">/topics</span> <span class="dim">(' + TOPICS.length + ' tags)</span>', d: 65 },
    { t: '[ <span class="ok">OK</span> ] growing the dark forest <span class="dim">(ambient treeline: ' + (state.forest ? 'on' : 'off') + ')</span>', d: 70 },
    { t: '[ <span class="ok">OK</span> ] loading phosphor drivers <span class="dim">[' + state.theme + ']</span>', d: 50 },
    { t: '[ <span class="ok">OK</span> ] initializing CRT subsystem', d: 45 },
    { t: '[ <span class="warn">WARN</span> ] sound subsystem inactive <span class="dim">(type \'sound on\' to enable)</span>', d: 40 },
    { t: '[ <span class="ok">OK</span> ] reading history <span class="dim">(' + state.history.length + ' commands)</span>', d: 35 },
    { t: '', d: 60 },
  ];

  for (const line of bootLines) {
    print(line.t, 'boot-line');
    await sleep(reduced() ? 0 : line.d);
  }

  printMotd();
  printBlank();

  const hello = print('<span class="dim"></span>', 'lore-line');
  await typeOutText('you are here because you typed something, once. welcome back.', hello, 14, false);
  const tip = print('<span class="dim"></span>', 'lore-line');
  await typeOutText('prefer the classic blog? type \'web\' — or click blog ↗ in the status bar.', tip, 12, false);

  cmdInput.focus();
}

boot();
