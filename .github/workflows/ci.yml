name: Build & Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-rss-plugin mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin

      - name: Regenerate indexes
        run: python3 tools/update_index.py

      - name: Build (strict)
        run: mkdocs build --strict --clean

      - name: Verify generated pages
        run: |
          test -f site/index.html
          test -f site/feed_rss_created.xml
          test -f site/robots.txt
          test -f site/assets/images/favicon.svg
          test -f site/entries/002-nine-one-and-five-sessions.html
          ! grep -rq "PLACEHOLDER" site/ || exit 1
